<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1216"/>
      <stop offset="55%" stop-color="#16161C"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="55%" stop-color="#E0492C"/>
      <stop offset="100%" stop-color="#A82E18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC29A"/>
      <stop offset="100%" stop-color="#E0492C"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" rx="24" fill="url(#bg)"/>

  <!-- 手机外框 -->
  <rect x="26" y="18" width="56" height="72" rx="13"
        fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- 三条扫描线：由短到长、由淡到亮 -->
  <rect x="37" y="34" width="16" height="4.6" rx="2.3" fill="url(#bar)" opacity="0.42"/>
  <rect x="37" y="47" width="23" height="4.6" rx="2.3" fill="url(#bar)" opacity="0.72"/>
  <rect x="37" y="60" width="30" height="4.6" rx="2.3" fill="url(#bar)"/>

  <!-- 右下角标：一个极小的向上三角，暗示「提升」，不占视觉重心 -->
  <path d="M66 76 L66 66 L76 76 Z" fill="#FF8A5C" opacity="0.9"/>
</svg>
