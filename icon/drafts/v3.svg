<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1216"/>
      <stop offset="55%" stop-color="#16161C"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="55%" stop-color="#E0492C"/>
      <stop offset="100%" stop-color="#A82E18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB285"/>
      <stop offset="100%" stop-color="#E0492C"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" rx="24" fill="url(#bg)"/>

  <!-- 手机外框 -->
  <rect x="28" y="20" width="52" height="68" rx="12"
        fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- 屏幕内：小格子像素化，由粗到细，示意分辨率提升 -->
  <g fill="url(#bar)">
    <rect x="39" y="37" width="7" height="7" rx="1.6" opacity="0.45"/>
    <rect x="49" y="37" width="7" height="7" rx="1.6" opacity="0.45"/>
    <rect x="59" y="37" width="7" height="7" rx="1.6" opacity="0.45"/>

    <rect x="39" y="47" width="7" height="7" rx="1.6" opacity="0.72"/>
    <rect x="49" y="47" width="7" height="7" rx="1.6" opacity="0.72"/>
    <rect x="59" y="47" width="7" height="7" rx="1.6" opacity="0.72"/>

    <rect x="39" y="57" width="7" height="7" rx="1.6"/>
    <rect x="49" y="57" width="7" height="7" rx="1.6"/>
    <rect x="59" y="57" width="7" height="7" rx="1.6"/>
  </g>
</svg>
