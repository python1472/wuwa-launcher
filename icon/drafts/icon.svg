<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1216"/>
      <stop offset="55%" stop-color="#16161C"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="50%" stop-color="#E0492C"/>
      <stop offset="100%" stop-color="#A82E18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB285"/>
      <stop offset="100%" stop-color="#E0492C"/>
    </linearGradient>
  </defs>

  <!-- 底 -->
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>

  <!-- 屏幕外框：圆角矩形 -->
  <rect x="30" y="22" width="48" height="64" rx="10"
        fill="none" stroke="url(#ring)" stroke-width="4.5"/>

  <!-- 屏幕内的三条渲染扫描线，由短到长，暗示分辨率提升 -->
  <rect x="40" y="40" width="17" height="4" rx="2" fill="url(#bar)" opacity="0.55"/>
  <rect x="40" y="51" width="24" height="4" rx="2" fill="url(#bar)" opacity="0.8"/>
  <rect x="40" y="62" width="28" height="4" rx="2" fill="url(#bar)"/>

  <!-- 右下角的扩展箭头：外层弧线 + 角标，表示渲染放大 -->
  <path d="M70 74 A 26 26 0 0 0 84 52" fill="none"
        stroke="#FF8A5C" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M84 52 L84 44 M84 52 L76 52" fill="none"
        stroke="#FF8A5C" stroke-width="3.2" stroke-linecap="round"/>
</svg>
