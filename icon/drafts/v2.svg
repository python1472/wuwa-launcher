<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1216"/>
      <stop offset="55%" stop-color="#16161C"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="55%" stop-color="#E0492C"/>
      <stop offset="100%" stop-color="#A82E18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB285"/>
      <stop offset="100%" stop-color="#E0492C"/>
    </linearGradient>
    <linearGradient id="arw" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0492C"/>
      <stop offset="100%" stop-color="#FFA070"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" rx="24" fill="url(#bg)"/>

  <!-- 手机外框（左下，缩小一点给箭头让位） -->
  <rect x="24" y="24" width="46" height="60" rx="11"
        fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- 三条扫描线 -->
  <rect x="34" y="40" width="14" height="4" rx="2" fill="url(#bar)" opacity="0.5"/>
  <rect x="34" y="50" width="19" height="4" rx="2" fill="url(#bar)" opacity="0.78"/>
  <rect x="34" y="60" width="26" height="4" rx="2" fill="url(#bar)"/>

  <!-- 右上角放大箭头：斜线 + 箭头 -->
  <path d="M62 46 L88 20" stroke="url(#arw)" stroke-width="5" stroke-linecap="round"/>
  <path d="M88 20 L74 20 M88 20 L88 34" stroke="url(#arw)"
        stroke-width="5" stroke-linecap="round"/>
</svg>
